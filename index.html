<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme bootstrap: resolve & apply [data-theme] before any paint to prevent FOUC.
         Reads saved preference, falls back to prefers-color-scheme, then dark. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('midroc.theme.v1');
          var t = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/midroc.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="Midroc Investment Group — Building Africa's future across agriculture, mining, construction, manufacturing, e-commerce, and hospitality." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Midroc Investment Group</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
